apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-hello-world:dev
spec:
  project: default
  source:
    repoURL: https://github.com/mdgilene/kargo-experiment.git
    targetRevision: stage/dev
    path: chart
    helm:
      valueFiles:
        - values.yaml
        - ../values-stage.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
