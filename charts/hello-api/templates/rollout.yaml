apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-api.fullname" . }}-html
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head>
        <title>Hello API</title>
      </head>
      <body>
        <h1>{{ .Values.message }}</h1>
        <ul>
          <li>Chart: {{ .Chart.Name }} {{ .Chart.Version }}</li>
          <li>App version: {{ .Chart.AppVersion }}</li>
          <li>Image: {{ .Values.image.repository }}:{{ .Values.image.tag }}</li>
        </ul>
      </body>
    </html>
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "hello-api.fullname" . }}
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  # Keep recent AnalysisRuns (and the Jobs/pods they own) around so results and logs can be inspected
  analysis:
    successfulRunHistoryLimit: {{ .Values.rollout.analysisHistoryLimit }}
    unsuccessfulRunHistoryLimit: {{ .Values.rollout.analysisHistoryLimit }}
  selector:
    matchLabels:
      {{- include "hello-api.selectorLabels" . | nindent 6 }}
  strategy:
    blueGreen:
      activeService: {{ include "hello-api.fullname" . }}
      previewService: {{ include "hello-api.fullname" . }}-preview
      prePromotionAnalysis:
        templates:
          - templateName: {{ include "hello-api.fullname" . }}-smoke
      autoPromotionEnabled: {{ .Values.rollout.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollout.scaleDownDelaySeconds }}
  template:
    metadata:
      annotations:
        checksum/config: {{ printf "%s-%s-%s" .Values.message .Values.image.tag .Chart.Version | sha256sum }}
      labels:
        {{- include "hello-api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: html
          configMap:
            name: {{ include "hello-api.fullname" . }}-html

