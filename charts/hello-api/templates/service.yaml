apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-api.fullname" . }}
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
      protocol: TCP
      name: http
  selector:
    {{- include "hello-api.selectorLabels" . | nindent 4 }}

---
# Preview Service: points at the new (green) ReplicaSet before it becomes active
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-api.fullname" . }}-preview
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hello-api.selectorLabels" . | nindent 4 }}
