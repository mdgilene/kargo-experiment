apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo-hello-world
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world
      sources:
        stages:
          - dev
  verification:
    analysisTemplates:
      - name: e2e
      - name: e2e-api
    args:
      - name: host
        value: hello-world-staging.hello-world-staging.svc.cluster.local
      - name: expectedMessage
        value: "Hello World from staging!"
      - name: apiHost
        value: hello-api-staging.hello-api-staging.svc.cluster.local
      - name: apiExpectedMessage
        value: "Hello API from staging!"
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/mdgilene/kargo-experiment.git
      steps:
        # Tagged repo version from Freight -> ./src, stage branch -> ./out
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: stage/staging
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        # All charts, this stage's values, and this stage's child Application manifests
        - uses: copy
          config:
            inPath: ./src/charts
            outPath: ./out/charts
        - uses: copy
          config:
            inPath: ./src/stages/staging
            outPath: ./out/values
        - uses: copy
          config:
            inPath: ./src/apps/staging
            outPath: ./out/apps
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: "kargo: staging <- repo ${{ commitFrom(vars.repo).Tag }}"
        - uses: git-push
          config:
            path: ./out
        # Sync the root first (it creates/updates the child apps), then wait on each child
        - uses: argocd-update
          as: root
          config:
            apps:
              - name: root-staging
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
        - uses: argocd-update
          config:
            apps:
              - name: hello-world-staging
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
              - name: hello-api-staging
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
