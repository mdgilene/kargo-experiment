apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo-hello-world
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world
      sources:
        stages:
          - dev
  verification:
    analysisTemplates:
      - name: wait-15s
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/mdgilene/kargo-experiment.git
      steps:
        # Tagged repo version from Freight -> ./src, stage branch -> ./out
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: stage/staging
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ./src/charts/hello-world
            outPath: ./out/chart
        - uses: copy
          config:
            inPath: ./src/stages/staging/values.yaml
            outPath: ./out/values-stage.yaml
        - uses: yaml-update
          config:
            path: ./out/values-stage.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom('nginxinc/nginx-unprivileged').Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: "kargo: staging <- repo ${{ commitFrom(vars.repo).Tag }}, image ${{ imageFrom('nginxinc/nginx-unprivileged').Tag }}"
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: hello-world-staging
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
