apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-hello-world
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/mdgilene/kargo-experiment.git
      steps:
        # Tagged repo version from Freight -> ./src, stage branch -> ./out
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: stage/prod
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ./src/charts/hello-world
            outPath: ./out/chart
        - uses: copy
          config:
            inPath: ./src/stages/prod/values.yaml
            outPath: ./out/values-stage.yaml
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: "kargo: prod <- repo ${{ commitFrom(vars.repo).Tag }}"
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: hello-world-prod
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
