apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-hello-world
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/mdgilene/kargo-experiment.git
            checkout:
              - branch: main
                path: ./src
        - uses: helm-update-image
          config:
            path: ./src/stages/prod/values.yaml
            images:
              - image: nginxinc/nginx-unprivileged
                key: image.tag
                value: Tag
        - uses: git-commit
          as: commit
          config:
            path: ./src
            message: "kargo: promote ${{ imageFrom('nginxinc/nginx-unprivileged').Tag }} to prod"
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: hello-world-prod
                namespace: argocd
                sources:
                  - repoURL: https://github.com/mdgilene/kargo-experiment.git
                    desiredRevision: ${{ outputs.commit.commit }}
