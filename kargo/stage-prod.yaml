apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-hello-world
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world-releases
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/mdgilene/kargo-experiment.git
      steps:
        # Tagged repo version from Freight -> ./src, stage branch -> ./out
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: stage/prod
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        # All charts, this stage's values, and this stage's child Application manifests
        - uses: copy
          config:
            inPath: ./src/charts
            outPath: ./out/charts
        - uses: copy
          config:
            inPath: ./src/stages/prod
            outPath: ./out/values
        - uses: copy
          config:
            inPath: ./src/apps/prod
            outPath: ./out/apps
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: "kargo: prod <- repo ${{ commitFrom(vars.repo).Tag }}"
        - uses: git-push
          config:
            path: ./out
        # Sync the root first (it creates/updates the child apps), then wait on each child
        - uses: argocd-update
          as: root
          config:
            apps:
              - name: root-prod
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
        - uses: argocd-update
          config:
            apps:
              - name: hello-world-prod
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
              - name: hello-api-prod
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
