apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: wait-15s
  namespace: kargo-hello-world
spec:
  metrics:
    - name: wait
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: wait
                    image: busybox:1.36
                    command: ["sh", "-c", "sleep 15"]
