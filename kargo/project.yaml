apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-hello-world
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-hello-world
  namespace: kargo-hello-world
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    - stageSelector:
        name: staging
      autoPromotionEnabled: true
    - stageSelector:
        name: release
      autoPromotionEnabled: true
    - stageSelector:
        name: prod
      autoPromotionEnabled: true
