apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-hello-world
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/mdgilene/kargo-experiment.git
            checkout:
              - branch: main
                path: ./src
        - uses: yaml-update
          config:
            path: ./src/stages/dev/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom('nginxinc/nginx-unprivileged').Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./src
            message: "kargo: promote ${{ imageFrom('nginxinc/nginx-unprivileged').Tag }} to dev"
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: hello-world-dev
                namespace: argocd
                sources:
                  - repoURL: https://github.com/mdgilene/kargo-experiment.git
                    desiredRevision: ${{ outputs.commit.commit }}
