apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hello-world
  namespace: kargo-hello-world
spec:
  interval: 5m
  subscriptions:
    - image:
        repoURL: nginxinc/nginx-unprivileged
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^1\.27\.\d+-alpine$
        discoveryLimit: 5
