apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hello-world
  namespace: kargo-hello-world
spec:
  interval: 30s
  subscriptions:
    # This repository (chart + stage values), versioned with semver git tags (v0.1.0, ...)
    - git:
        repoURL: https://github.com/mdgilene/kargo-experiment.git
        commitSelectionStrategy: SemVer
        semverConstraint: ">=0.1.0"
        discoveryLimit: 5
