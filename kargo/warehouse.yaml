apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hello-world
  namespace: kargo-hello-world
spec:
  interval: 30s
  subscriptions:
    # Watches release candidate tags (e.g. v0.4.0-rc.1) to feed dev -> staging -> release
    - git:
        repoURL: https://github.com/mdgilene/kargo-experiment.git
        commitSelectionStrategy: SemVer
        strictSemvers: false
        semverConstraint: ">=0.1.0-0"
        allowTagsRegexes:
          - ^v\d+\.\d+\.\d+-rc\.\d+$
        discoveryLimit: 5
